# This workflow will build a Python app and deploy it to an Azure Functions App on Linux when a commit is pushed to your default branch.
#
# This workflow assumes you have already created the target Azure Functions app.
# For instructions see https://learn.microsoft.com/en-us/azure/azure-functions/create-first-function-vs-code-python?pivots=python-mode-configuration
#
# To configure this workflow:
# 1. Set up the following secrets in your repository:
#   - AZFUNCTIONS_PUBLISHING_PROFILE
# 2. Change env variables for your configuration.
#
# For more information on:
#   - GitHub Actions for Azure: https://github.com/Azure/Actions
#   - Azure Functions Action: https://github.com/Azure/functions-action
#   - Publish Profile: https://github.com/Azure/functions-action#using-publish-profile-as-deployment-credential-recommended
#   - Azure Service Principal for RBAC: https://github.com/Azure/functions-action#using-azure-service-principal-for-rbac-as-deployment-credential
#
# For more samples to get started with GitHub Action workflows to deploy to Azure: https://github.com/Azure/actions-workflow-samples/tree/master/FunctionApp

name: Deploy azfunctions to Azure Function App

on:
  push:
    branches: ["main", "develop"]
    paths: ["azfunctions/**", ".github/workflows/azure-functions-app-python.yml"]

env:
  AZURE_FUNCTIONAPP_NAME: ${{ github.ref_name == 'main' && 'resumematchpro-prod-function-app' || 'resumematchpro-dev-function-app' }}
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'azfunctions'
  PYTHON_VERSION: '3.11'
  # Runtime settings
  ENABLE_ORYX_BUILD: 'true'
  SCM_DO_BUILD_DURING_DEPLOYMENT: 'true'
  PYTHON_ISOLATE_WORKER_DEPENDENCIES: '1'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

    steps:
    - name: 'Checkout GitHub Action'
      uses: actions/checkout@v4

    - name: Setup Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: 'Validate Project Structure'
      run: |
        pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
        if [ ! -f "pyproject.toml" ]; then
          echo "pyproject.toml not found"
          exit 1
        fi
        if [ ! -f "function_app.py" ]; then
          echo "function_app.py not found"
          exit 1
        fi
        if [ ! -f "host.json" ]; then
          echo "host.json not found"
          exit 1
        fi
        popd

    - name: 'Generate requirements.txt'
      run: |
        pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
        # Install pip-tools with error handling
        if ! pip install -q pip-tools; then
          echo "Failed to install pip-tools"
          exit 1
        fi
        # Generate requirements.txt with error handling
        if ! pip-compile pyproject.toml -o requirements.txt; then
          echo "Failed to generate requirements.txt"
          exit 1
        fi
        # Verify requirements.txt was created
        if [ ! -f "requirements.txt" ]; then
          echo "requirements.txt was not generated"
          exit 1
        fi
        popd

    - name: 'Validate Python Installation'
      run: |
        python --version
        if [ $? -ne 0 ]; then
          echo "Python installation failed"
          exit 1
        fi

    - name: 'Install Dependencies'
      run: |
        pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
        # Install dependencies from requirements.txt using pip for Azure Functions compatibility
        pip install -r requirements.txt --target=".python_packages/lib/site-packages"
        popd

    - name: 'Verify Deployment Package'
      run: |
        pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
        echo "=== Deployment Package Structure ==="
        ls -la
        echo "=== Requirements.txt Content ==="
        cat requirements.txt
        echo "=== Function App Files ==="
        find . -type f -not -path "*/\.*" -not -path "*/__pycache__/*"
        popd

    - name: 'Create Deployment Package'
      run: |
        pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
        # Create a clean deployment package
        zip -r ../deployment.zip . -x "*.git*" "*.venv*" "*.pytest_cache*" "*.mypy_cache*" "*.coverage*" "*.pyc" "__pycache__/*"
        popd

    - name: 'Verify ZIP Package'
      run: |
        echo "=== ZIP Package Contents ==="
        unzip -l ./${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/../deployment.zip

    - name: 'Deploy to Azure Functions'
      uses: Azure/functions-action@v1
      id: fa
      with:
        app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
        package: ./${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/../deployment.zip
        publish-profile: ${{ secrets.AZFUNCTIONS_PUBLISHING_PROFILE }}
        scm-do-build-during-deployment: true
        enable-oryx-build: true
        respect-funcignore: true
      continue-on-error: false

    - name: 'Post Deployment Check'
      if: success()
      run: |
        echo "Deployment completed successfully"
        echo "Function App URL: https://${{ env.AZURE_FUNCTIONAPP_NAME }}.azurewebsites.net"
