[project]
name = "resumematchpro-azfunctions"
version = "0.1.0"
description = "Azure Functions for ResumeMatchPro"
requires-python = ">=3.11"
dependencies = [
    "azure-ai-formrecognizer==3.3.3",
    "azure-common==1.1.28",
    "azure-core-tracing-opentelemetry==1.0.0b12",
    "azure-cosmos==4.6.0",
    "azure-functions==1.18.0",
    "azure-identity==1.16.0",
    "azure-monitor-opentelemetry==1.6.5",
    "azure-monitor-opentelemetry-exporter==1.0.0b35",
    "azure-storage-blob==12.19.1",
    "azure-storage-queue==12.9.0",
    "openai==1.17.1",
    "opentelemetry-api==1.28.0",
    "opentelemetry-instrumentation-logging==0.49b0",
    "opentelemetry-instrumentation-requests==0.49b0",
    "opentelemetry-sdk>=1.28.0",
    "pydantic==2.7.0",
    "python-docx==1.1.0",
    "python-dotenv==1.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
index-url = "https://pypi.org/simple" 

[dependency-groups]
dev = [
    "coverage==7.6.12",
    "pytest>=8.2.0",
    "pytest-asyncio==0.25.3",
    "pytest-cov==6.0.0",
    "pytest-xdist==3.6.1",
]
